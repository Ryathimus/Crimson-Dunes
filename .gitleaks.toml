title = "Crimson Dunes secret scanning baseline"

[[rules]]
id = "google-api-key"
description = "Google API key"
regex = '''AIza[0-9A-Za-z_-]{20,}'''
secretGroup = 0

[[rules]]
id = "common-env-api-key"
description = "Common API key-style environment assignment"
regex = '''(?i)(GOOGLE_API_KEY|GEMINI_API_KEY|OPENAI_API_KEY|ANTHROPIC_API_KEY|API_KEY)\s*=\s*[^\s]+'''
secretGroup = 0
